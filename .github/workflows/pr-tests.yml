name: PR Tests

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pr-tests.yml'
      - '.github/workflows/release.yml'
      - 'src/**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/packages.lock.json'
      - '**/nuget.config'
      - '**/NuGet.Config'
      - 'global.json'

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request'
    name: Windows .NET tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select the exact tested commit
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $mergeTree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve merge tree' }
          $headTree = git rev-parse "$env:PR_HEAD_SHA`^{tree}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve PR head tree' }
          # Keep testing the merge result when the base introduced different content.
          if ($mergeTree -eq $headTree) {
            git checkout --detach $env:PR_HEAD_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Cannot check out equivalent PR head' }
          }
      - name: Verify test-reuse decisions
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseTestReuse.ps1
      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('src/**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/nuget.config', '**/NuGet.Config', 'global.json') }}
      - name: Run tests
        run: dotnet test src/ASPAssistant.Tests/ASPAssistant.Tests.csproj -c Release --filter "Category!=LocalScreenshot"
      - name: Record successful test evidence
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve tested commit' }
          $folder = Join-Path $env:RUNNER_TEMP 'verified-tests'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          @{ schema = 1; repository = $env:GITHUB_REPOSITORY; sha = $sha;
             runId = $env:GITHUB_RUN_ID; runAttempt = [int]$env:GITHUB_RUN_ATTEMPT;
             suite = 'public-windows-dotnet-v1'; runnerOS = $env:RUNNER_OS } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $folder 'result.json') -Encoding utf8
      - name: Upload test evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-tests/result.json
          retention-days: 30
          if-no-files-found: error

  warm-cache:
    name: Warm default-branch NuGet cache
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('src/**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/nuget.config', '**/NuGet.Config', 'global.json') }}
      - name: Restore test and release dependencies
        if: steps.nuget.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          dotnet restore src/ASPAssistant.Tests/ASPAssistant.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/ASPAssistant.App/ASPAssistant.App.csproj -r win-x64 -p:SelfContained=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
