name: 功能建议
description: 描述使用场景、当前不便，以及希望增加或改进的功能。
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先搜索是否已有相近讨论，尽量描述具体使用场景。
        截图和示例可直接附在表单中，提交前请隐去个人信息。
  - type: textarea
    id: usage-scenario
    attributes:
      label: 使用场景
      placeholder: 在什么情况下，你希望使用这项功能？
    validations:
      required: true
  - type: textarea
    id: current-problem
    attributes:
      label: 当前的不便
      placeholder: 现在如何操作？哪一步繁琐、缺失或容易出错？
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: 希望的行为
      placeholder: 希望增加什么入口或操作？完成后应看到什么结果？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 补充材料（可选）
      placeholder: 已尝试的办法、其他方案、示意图或相关讨论链接。
